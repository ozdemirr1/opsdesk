[project]
name = "opsdesk"
version = "0.1.0"
authors = [
    { name = "Furkan Özdemir", email = "158217530+ozdemirr1@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
