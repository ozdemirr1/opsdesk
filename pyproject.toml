[project]
name = "opsdesk"
version = "0.1.0"
authors = [
    { name = "Furkan Özdemir", email = "158217530+ozdemirr1@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib --tb=native --no-showlocals"
# Temporary: Starlette 1.6.0 still uses the deprecated AnyIO portal alias.
# Upstream main is fixed; remove after upgrading to a release containing that fix.
filterwarnings = [
    'ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:starlette\.testclient$',
]
markers = [
    "integration: requires the dedicated local PostgreSQL test database",
]
